# Server Configuration
server.port=8082
spring.application.name=POS-Tax-VAT-System
spring.profiles.default=fixture

# Database Configuration (PostgreSQL for JSONB support)
spring.datasource.url=jdbc:postgresql://localhost:5432/pos_tax_vat_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# VAT Configuration
vat.service.fee.rate=0.02
vat.refund.window.days=90
pos.currency.code=ETB

# Payment Gateway Configuration
payment.gateway.timeout.seconds=30
payment.gateway.offline.mode.enabled=false

# Pre-Auth Configuration
preauth.default.expiry.hours=72
preauth.expiry.check.interval.minutes=5

# Logging Configuration
logging.level.com.example.postaxvatsystem=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Profile Configuration
spring.profiles.active=fixture
 
# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Encryption Configuration
encryption.key=${ENCRYPTION_KEY}

# Hash Configuration (for searchable encryption)
hash.key=${HASH_KEY}

# Rate Limiting Configuration
rate.limit.requests-per-minute=100
rate.limit.requests-per-hour=1000

# Health Check Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
