services:
  - type: web
    name: pos-tax-vat-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: BM-tax-vat-payment-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: BM-tax-vat-payment-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: BM-tax-vat-payment-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: HASH_KEY
        generateValue: true

databases:
  - name: BM-tax-vat-payment-db
    databaseName: postaxvatsystem_gt6u
    user: postaxvatsystem
    plan: free
    region: oregon
