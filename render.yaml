services:
  - type: web
    name: pos-tax-vat-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_PASSWORD
        fromDatabase:
          name: pos-tax-vat-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: HASH_KEY
        generateValue: true

databases:
  - name: pos-tax-vat-db
    databaseName: pos_tax_vat_db
    user: pos_tax_vat_user
    plan: free
    region: oregon
